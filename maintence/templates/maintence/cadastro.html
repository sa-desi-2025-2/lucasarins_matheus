{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ROIMANUTENCE</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-primaria: #000000;
            --cor-fundo: #f3f4f6;
            --cor-card: #ffffff;
        }
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: var(--cor-fundo);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .cadastro-container {
            max-width: 600px;
            width: 100%;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        
        .logo-section h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--cor-primaria);
            margin: 0;
        }
        
        .cadastro-card {
            background-color: var(--cor-card);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }
        
        .cadastro-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--cor-primaria);
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 0.25rem rgba(0, 0, 0, 0.1);
        }
        
        .btn-cadastro {
            background-color: var(--cor-primaria);
            color: #ffffff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .btn-cadastro:hover {
            background-color: #333333;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .login-link a {
            color: var(--cor-primaria);
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 0.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="cadastro-container">
        <div class="logo-section">
            <img src="{% static 'maintence/img/21-10.webp' %}" alt="Logo ROIMANUTENCE">
            <h1>ROIMANUTENCE</h1>
        </div>
        
        <div class="cadastro-card">
            <h2>Crie sua Conta</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" action="{% url 'cadastro' %}">
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nome" class="form-label">Nome Completo:</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    
                    <div class="col-12">
                        <label for="user" class="form-label">Usuário:</label>
                        <input type="text" class="form-control" id="user" name="user" required>
                    </div>
                    
                    <div class="col-12">
                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="col-12">
                        <label for="re" class="form-label">RE (Registro de Empregado):</label>
                        <input type="text" class="form-control" id="re" name="re" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" class="form-control" id="senha" name="senha" required minlength="6">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="confirmar-senha" class="form-label">Confirmar Senha:</label>
                        <input type="password" class="form-control" id="confirmar-senha" name="confirmar-senha" required minlength="6">
                    </div>
                </div>
                
                <button type="submit" class="btn-cadastro">Cadastrar</button>
            </form>
            
            <div class="login-link">
                Já tem uma conta? <a href="{% url 'login' %}">Faça login</a>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Validação de senha
        document.querySelector('form').addEventListener('submit', function(e) {
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;
            
            if (senha !== confirmar) {
                e.preventDefault();
                alert('As senhas não coincidem!');
            }
        });
    </script>
</body>
</html>
